<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【星曦向荣】抖音作品解析</title>

    <meta name="referrer" content="no-referrer">
    <!-- 引入Font Awesome图标 -->
    <link href="css/font-awesome.min-4.7.0.css" rel="stylesheet">
    <style>
        :root {
            --dyx-primary: #6366f1;
            --dyx-primary-dark: #4f46e5;
            --dyx-primary-soft: #eef0ff;
            --dyx-line: #ecedf1;
            --dyx-bg: #f4f5f8;
            --dyx-text: #14171f;
            --dyx-text-2: #4b5563;
            --dyx-text-3: #9aa1ad;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            background: var(--dyx-bg);
            color: var(--dyx-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 34px 16px 0;
        }

        .hidden { display: none !important; }

        .dyx-wrap { max-width: 880px; margin: 0 auto; }

        /* ---------- 页头 ---------- */
        .dyx-header {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin-bottom: 1.1rem;
            padding: 0 .25rem;
        }

        .dyx-logo {
            width: 2.6rem;
            height: 2.6rem;
            border-radius: .8rem;
            background: linear-gradient(135deg, var(--dyx-primary), #8b8cf8);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            box-shadow: 0 6px 16px rgba(99, 102, 241, .28);
            flex-shrink: 0;
        }

        .dyx-header-text { min-width: 0; }

        .dyx-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: .2px;
            margin: 0;
            line-height: 1.35;
        }

        .dyx-subtitle {
            font-size: .8rem;
            color: var(--dyx-text-3);
            margin: .15rem 0 0;
        }

        /* ---------- 通用卡片 ---------- */
        .dyx-card {
            background: #fff;
            border: 1px solid var(--dyx-line);
            border-radius: .9rem;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }

        /* ---------- 解析卡 ---------- */
        .dyx-parse { padding: .95rem 1rem 1rem; margin-bottom: .85rem; }

        .dyx-parse-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            font-size: .82rem;
            font-weight: 600;
            margin-bottom: .5rem;
        }

        .dyx-parse-label .dyx-label-hint {
            font-weight: 400;
            color: var(--dyx-text-3);
            font-size: .74rem;
        }

        .dyx-input-row { display: flex; gap: .5rem; }

        .dyx-input-wrap { position: relative; flex: 1; min-width: 0; }

        .dyx-input-wrap > i {
            position: absolute;
            left: .7rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dyx-text-3);
            font-size: .85rem;
            pointer-events: none;
        }

        .dyx-input {
            width: 100%;
            height: 2.55rem;
            padding: 0 .8rem 0 2rem;
            border: 1px solid #dfe1e7;
            border-radius: .55rem;
            background: #fff;
            color: var(--dyx-text);
            font-size: .86rem;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .dyx-input::placeholder { color: #b6bcc7; }

        .dyx-input:focus {
            border-color: var(--dyx-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .14);
        }

        .dyx-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            height: 2.55rem;
            padding: 0 1.1rem;
            border: 1px solid transparent;
            border-radius: .55rem;
            font-size: .86rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
            white-space: nowrap;
        }

        .dyx-btn-primary {
            background: var(--dyx-primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, .26);
        }

        .dyx-btn-primary:hover:not(:disabled) { background: var(--dyx-primary-dark); }

        .dyx-btn-ghost {
            background: #fff;
            border-color: #dfe1e7;
            color: var(--dyx-text-2);
        }

        .dyx-btn-ghost:hover:not(:disabled) { background: #f7f8fa; }

        .dyx-btn:disabled { opacity: .6; cursor: not-allowed; }

        .dyx-parse-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
            margin-top: .55rem;
            font-size: .75rem;
            color: var(--dyx-text-3);
        }

        .dyx-parse-foot .dyx-tip { line-height: 1.5; }

        /* 刷新开关 */
        .dyx-switch { display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; user-select: none; flex-shrink: 0; }
        .dyx-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
        .dyx-switch-track {
            width: 2rem;
            height: 1.1rem;
            border-radius: 999px;
            background: #d7dae1;
            position: relative;
            transition: background .15s ease;
        }
        .dyx-switch-track::after {
            content: "";
            position: absolute;
            top: .15rem;
            left: .15rem;
            width: .8rem;
            height: .8rem;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .16);
            transition: transform .15s ease;
        }
        .dyx-switch input:checked + .dyx-switch-track { background: var(--dyx-primary); }
        .dyx-switch input:checked + .dyx-switch-track::after { transform: translateX(.9rem); }
        .dyx-switch-text { color: var(--dyx-text-2); }

        /* ---------- 空态 / 加载 / 错误 ---------- */
        .dyx-state { padding: 2.6rem 1rem; text-align: center; margin-bottom: .85rem; }

        .dyx-state-icon {
            width: 3rem;
            height: 3rem;
            margin: 0 auto .7rem;
            border-radius: .85rem;
            background: var(--dyx-primary-soft);
            color: var(--dyx-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }

        .dyx-state-title { font-size: .9rem; font-weight: 600; margin: 0 0 .25rem; }
        .dyx-state-desc { font-size: .78rem; color: var(--dyx-text-3); margin: 0; line-height: 1.6; }

        .dyx-skeleton { width: 100%; max-width: 32rem; margin: .8rem auto 0; }
        .dyx-skeleton-bar {
            height: .62rem;
            border-radius: .35rem;
            margin-bottom: .45rem;
            background: linear-gradient(90deg, #f1f2f5 25%, #e7e9ee 50%, #f1f2f5 75%);
            background-size: 200% 100%;
            animation: dyx-shimmer 1.4s infinite;
        }
        .dyx-skeleton-bar:nth-child(1) { width: 70%; margin-left: auto; margin-right: auto; }
        .dyx-skeleton-bar:nth-child(2) { width: 92%; margin-left: auto; margin-right: auto; }
        .dyx-skeleton-bar:nth-child(3) { width: 55%; margin-left: auto; margin-right: auto; }
        @keyframes dyx-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .dyx-error { border-color: #fbd5d5; background: #fff8f8; }
        .dyx-error .dyx-state-icon { background: #fee2e2; color: #dc2626; }
        /* 技术详情默认折叠，点开才看堆栈，避免报错卡被一大段异常文本撑满 */
        .dyx-error-details {
            margin: .6rem 0 0;
            text-align: center;   /* 让「技术详情」胶囊在卡片里居中，和图标/文案/按钮同一条中轴 */
        }
        .dyx-error-details > summary {
            display: inline-block;
            cursor: pointer;
            font-size: .75rem;
            color: #b45309;
            background: #fff;
            border: 1px solid #fbd5d5;
            border-radius: .45rem;
            padding: .18rem .6rem;
            list-style: none;
            user-select: none;
        }
        .dyx-error-details > summary::-webkit-details-marker { display: none; }
        .dyx-error-details > summary::before { content: "▸ "; }
        .dyx-error-details[open] > summary::before { content: "▾ "; }
        .dyx-error-details[open] > summary { background: #fff5f5; }
        .dyx-error-details > summary:hover { background: #fff5f5; }
        .dyx-error-detail {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .72rem;
            color: #9b1c1c;
            background: #fff;
            border: 1px solid #fbd5d5;
            border-radius: .45rem;
            padding: .5rem .6rem;
            margin: .4rem auto 0;
            max-width: 34rem;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: anywhere;
            max-height: 8rem;
            overflow: auto;
        }
        .dyx-error .dyx-btn { margin-top: .8rem; }

        /* ---------- 结果卡 ---------- */
        .dyx-result { overflow: hidden; margin-bottom: .85rem; }

        .dyx-author {
            display: flex;
            align-items: center;
            gap: .7rem;
            padding: .95rem 1rem;
            border-bottom: 1px solid var(--dyx-line);
        }

        .dyx-avatar {
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            object-fit: cover;
            background: #f1f2f5;
            flex-shrink: 0;
        }

        .dyx-author-main { min-width: 0; flex: 1; }

        .dyx-author-name {
            font-size: .92rem;
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dyx-author-meta {
            display: flex;
            flex-wrap: wrap;
            gap: .3rem .55rem;
            margin-top: .25rem;
            font-size: .73rem;
            color: var(--dyx-text-3);
        }

        .dyx-author-meta .dyx-dot { color: #d5d8de; }

        .dyx-author-intro {
            font-size: .73rem;
            color: var(--dyx-text-3);
            margin: .3rem 0 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dyx-time {
            font-size: .74rem;
            color: var(--dyx-text-3);
            flex-shrink: 0;
        }

        .dyx-caption { padding: .85rem 1rem .1rem; }
        .dyx-caption-title {
            font-size: .9rem;
            line-height: 1.6;
            margin: 0;
            color: var(--dyx-text);
            word-break: break-word;
        }

        /* 数据统计 */
        .dyx-stats {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: .2rem;
            margin: .8rem 1rem 1rem;
            padding: .55rem .3rem;
            background: #f8f9fb;
            border: 1px solid #f0f1f5;
            border-radius: .6rem;
        }

        .dyx-stat { text-align: center; padding: .15rem 0; min-width: 0; }

        .dyx-stat-value {
            font-size: .92rem;
            font-weight: 700;
            color: var(--dyx-text);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dyx-stat-label {
            font-size: .68rem;
            color: var(--dyx-text-3);
            margin-top: .1rem;
            white-space: nowrap;
        }

        /* 标签切换（分段控件） */
        .dyx-tabs {
            display: flex;
            gap: .2rem;
            margin: 0 1rem;
            padding: .18rem;
            background: #f3f4f7;
            border-radius: .55rem;
        }

        .dyx-tab {
            flex: 1;
            height: 2rem;
            border: 0;
            border-radius: .42rem;
            background: transparent;
            color: var(--dyx-text-2);
            font-size: .8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .35rem;
            transition: background .15s ease, color .15s ease, box-shadow .15s ease;
        }

        .dyx-tab:hover { color: var(--dyx-text); }

        .dyx-tab.is-active {
            background: #fff;
            color: var(--dyx-primary-dark);
            box-shadow: 0 1px 2px rgba(16, 24, 40, .08);
            font-weight: 600;
        }

        /* 媒体区 */
        .dyx-panel { padding: .85rem 1rem 0; }

        .dyx-stage {
            background: #f6f7f9;
            border: 1px solid #f0f1f5;
            border-radius: .65rem;
            padding: .55rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .5rem;
            max-height: 62vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #d5d8de transparent;
        }
        .dyx-stage::-webkit-scrollbar { width: 6px; }
        .dyx-stage::-webkit-scrollbar-thumb { background: #d5d8de; border-radius: 3px; }

        .dyx-media-item {
            position: relative;
            border-radius: .45rem;
            overflow: hidden;
            background: #000;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color .15s ease;
            max-width: 100%;
            flex-shrink: 0;
        }

        .dyx-media-item:hover { border-color: rgba(99, 102, 241, .45); }
        .dyx-media-item.is-selected { border-color: var(--dyx-primary); }

        .dyx-media-item video {
            display: block;
            max-height: 46vh;
            max-width: 100%;
            background: #000;
        }

        .dyx-media-badge {
            position: absolute;
            top: .35rem;
            left: .35rem;
            background: rgba(0, 0, 0, .62);
            color: #fff;
            font-size: .68rem;
            padding: .1rem .4rem;
            border-radius: .3rem;
            pointer-events: none;
        }

        /* 图片条 */
        .dyx-image-strip {
            display: flex;
            gap: .55rem;
            overflow-x: auto;
            /* 父级 .dyx-stage 是 column + align-items:center，条带会按内容宽撑开并被居中，
               导致首图连同左上角序号被裁到面板外；显式吃掉整行宽度即可对齐 */
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: .1rem .05rem .35rem;
            scroll-snap-type: none; /* 去掉吸附：吸附会把首图推离可视区，序号角标跟着被裁 */
            scrollbar-width: thin;
            scrollbar-color: #cfd3dc transparent;
        }

        .dyx-image-strip::-webkit-scrollbar { height: 6px; }
        .dyx-image-strip::-webkit-scrollbar-thumb { background: #cfd3dc; border-radius: 3px; }
        .dyx-image-strip::-webkit-scrollbar-track { background: transparent; }

        .dyx-thumb {
            position: relative;
            flex-shrink: 0;
            width: 15rem;
            height: 40vh;
            min-height: 200px;
            border-radius: .45rem;
            overflow: hidden;
            border: 2px solid transparent;
            background: #fff;
            cursor: pointer;
            scroll-snap-align: start;
            transition: border-color .15s ease;
        }

        .dyx-thumb:hover { border-color: rgba(99, 102, 241, .45); }
        .dyx-thumb.is-selected { border-color: var(--dyx-primary); }

        .dyx-thumb img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #f1f2f5;
        }

        .dyx-thumb .dyx-thumb-spec {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: .2rem .4rem;
            font-size: .66rem;
            color: #fff;
            background: linear-gradient(to top, rgba(0, 0, 0, .66), rgba(0, 0, 0, 0));
            text-align: center;
        }

        /* 图片快速定位导航 */
        .dyx-image-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            padding: .15rem 1rem .55rem;
        }

        .dyx-nav-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            border: 1px solid #e5e7ee;
            background: #fff;
            color: var(--dyx-text-2);
            font-size: .9rem;
            line-height: 1;
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease, background .15s ease;
        }

        .dyx-nav-arrow:hover:not(:disabled) {
            color: var(--dyx-primary);
            border-color: rgba(99, 102, 241, .45);
        }

        .dyx-nav-arrow:disabled { opacity: .4; cursor: default; }

        .dyx-nav-dots {
            display: flex;
            align-items: center;
            gap: .3rem;
            overflow-x: auto;
            max-width: 100%;
            padding: .1rem 0;
            scrollbar-width: none;
        }

        .dyx-nav-dots::-webkit-scrollbar { display: none; }

        .dyx-nav-dot {
            flex: none;
            min-width: 1.55rem;
            height: 1.55rem;
            padding: 0 .35rem;
            border-radius: .8rem;
            border: 1px solid #e5e7ee;
            background: #fff;
            color: var(--dyx-text-2);
            font-size: .72rem;
            line-height: 1;
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease, background .15s ease;
        }

        .dyx-nav-dot:hover { color: var(--dyx-primary); border-color: rgba(99, 102, 241, .45); }

        .dyx-nav-dot.is-active {
            color: #fff;
            background: var(--dyx-primary);
            border-color: var(--dyx-primary);
        }

        /* 音频 */
        .dyx-audio-box {
            background: #f8f9fb;
            border: 1px solid #f0f1f5;
            border-radius: .65rem;
            padding: 1.3rem 1rem;
        }
        .dyx-audio-box audio { width: 100%; display: block; }

        /* 元信息条 + 下载 */
        .dyx-media-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
            flex-wrap: wrap;
            padding: .75rem 1rem .9rem;
        }

        .dyx-chips { display: flex; flex-wrap: wrap; gap: .4rem; }

        .dyx-chip {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            font-size: .72rem;
            color: var(--dyx-text-2);
            background: #f4f5f8;
            border: 1px solid #ebedf1;
            border-radius: .35rem;
            padding: .22rem .45rem;
        }

        .dyx-chip i { color: var(--dyx-text-3); }

        .dyx-chip b { font-weight: 600; color: var(--dyx-text); }

        /* ---------- 页脚 ---------- */
        .dyx-footer {
            text-align: center;
            color: var(--dyx-text-3);
            font-size: .75rem;
            line-height: 1.7;
            padding: 1.1rem 0 1.6rem;
        }

        .dyx-footer a { color: var(--dyx-text-3); text-decoration: none; }
        .dyx-footer a:hover { color: var(--dyx-primary); }

        /* ---------- 响应式 ---------- */
        @media (max-width: 720px) {
            body { padding: 18px 12px 0; }
            .dyx-title { font-size: 1.1rem; }
            .dyx-logo { width: 2.3rem; height: 2.3rem; font-size: 1rem; }
            .dyx-input-row { flex-direction: column; }
            .dyx-btn-primary { width: 100%; }
            .dyx-parse-foot { flex-direction: column; align-items: flex-start; gap: .4rem; }
            .dyx-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .35rem; }
            .dyx-time { display: none; }
            .dyx-tab { font-size: .76rem; }
            .dyx-thumb { width: 10.5rem; height: 30vh; min-height: 160px; }
            .dyx-media-foot .dyx-btn-primary { width: 100%; }
            .dyx-author-intro {
                margin-top: .15rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }
    </style>
    <script src="js/mainURL.js"></script>
    <script src="js/client-info.js"></script>
    <script src="js/ui.js"></script>
<script src="js/util.js"></script>
</head>
<body>
<div class="dyx-wrap">
    <header class="dyx-header">
        <div class="dyx-logo"><i class="fa fa-play"></i></div>
        <div class="dyx-header-text">
            <h1 class="dyx-title">抖音作品解析</h1>
            <p class="dyx-subtitle">粘贴分享链接，解析视频、图集与音频</p>
        </div>
    </header>

    <!-- 链接输入 -->
    <section class="dyx-card dyx-parse">
        <div class="dyx-parse-label">
            <span>作品链接</span>
            <span class="dyx-label-hint">支持视频 / 图集分享文案</span>
        </div>
        <div class="dyx-input-row">
            <div class="dyx-input-wrap">
                <i class="fa fa-link"></i>
                <input type="text" id="shareLinkInput" class="dyx-input"
                       placeholder="粘贴作品分享链接或整段分享文案…">
            </div>
            <button id="parseBtn" class="dyx-btn dyx-btn-primary">
                <i class="fa fa-search"></i><span>解析链接</span>
            </button>
        </div>
        <div class="dyx-parse-foot">
            <span class="dyx-tip">注意限流，按 IP 限流（默认 3 次/分钟），链接可直接粘贴整段分享文案。</span>

        <div class="dyx-skeleton">

            <div class="dyx-skeleton-bar"></div>
            <div class="dyx-skeleton-bar"></div>

    <!-- 错误状态 -->
    <div id="error" class="dyx-card dyx-state dyx-error hidden">
        <div class="dyx-state-icon"><i class="fa fa-exclamation-triangle"></i></div>
        <p id="errorMessage" class="dyx-state-title">解析链接失败，请检查链接是否有效</p>
        <details id="errorDetailWrap" class="dyx-error-details hidden">
            <summary>技术详情</summary>
            <p id="errorDetail" class="dyx-error-detail"></p>
        </details>
        <button id="retryBtn" class="dyx-btn dyx-btn-ghost"><i class="fa fa-refresh"></i>重新解析</button>
    </div>

    <!-- 结果 -->
    <div id="contentContainer" class="dyx-card dyx-result hidden">
        <!-- 作者 -->
        <div class="dyx-author">
            <img id="authorAvatar" src="" alt="作者头像" class="dyx-avatar">
            <div class="dyx-author-main">
                <h3 id="authorName" class="dyx-author-name"></h3>
                <div id="tagsContainer" class="dyx-author-meta"></div>
                <p id="authorIntro" class="dyx-author-intro"></p>
            </div>
            <span class="dyx-time"><i class="fa fa-clock-o mr-1"></i><span id="videoCreateTime"></span></span>
        </div>

        <!-- 标题 -->
        <div class="dyx-caption">
            <h3 id="videoTitle" class="dyx-caption-title"></h3>
        </div>

        <!-- 数据统计 -->
        <div class="dyx-stats">
            <div class="dyx-stat">
                <div id="likeCount" class="dyx-stat-value"></div>
                <div class="dyx-stat-label"><i class="fa fa-thumbs-up"></i> 点赞</div>
            </div>
            <div class="dyx-stat">
                <div id="collectCount" class="dyx-stat-value"></div>
                <div class="dyx-stat-label"><i class="fa fa-star"></i> 收藏</div>
            </div>
            <div class="dyx-stat">
                <div id="shareCount" class="dyx-stat-value"></div>
                <div class="dyx-stat-label"><i class="fa fa-share"></i> 分享</div>
            </div>
            <div class="dyx-stat">
                <div id="commentCount" class="dyx-stat-value"></div>
                <div class="dyx-stat-label"><i class="fa fa-comment"></i> 评论</div>
            </div>
            <div class="dyx-stat">
                <div id="recommendCount" class="dyx-stat-value"></div>
                <div class="dyx-stat-label"><i class="fa fa-thumbs-o-up"></i> 推荐</div>

            <div class="dyx-stat">
                <div id="admireCount" class="dyx-stat-value"></div>
                <div class="dyx-stat-label"><i class="fa fa-trophy"></i> 赞赏</div>

        <!-- 标签切换 -->
        <div class="dyx-tabs" id="tabs">

            </div>

            <div id="imageNav" class="dyx-image-nav hidden">
                <button type="button" class="dyx-nav-arrow" data-nav="prev" aria-label="上一张"><i class="fa fa-angle-left"></i></button>
                <div id="imageNavDots" class="dyx-nav-dots"></div>

            </div>

                <div class="dyx-chips">
                    <span class="dyx-chip"><i class="fa fa-picture-o"></i>点选图片后下载</span>
                </div>
                <button id="downloadImageBtn" class="dyx-btn dyx-btn-primary">
                    <i class="fa fa-download"></i><span>下载图片</span>
                </button>
            </div>

        <!-- 音频面板 -->
        <div id="audioTab" class="content-panel dyx-panel hidden">
            <div class="dyx-audio-box">

                    您的浏览器不支持音频播放
                </audio>
            </div>
            <div class="dyx-media-foot">
                <div class="dyx-chips">
                    <span class="dyx-chip"><i class="fa fa-music"></i>背景音乐原文件</span>
                </div>
                <button id="downloadAudioBtn" class="dyx-btn dyx-btn-primary">
                    <i class="fa fa-download"></i><span>下载音频</span>

    <p>© 2025 【星曦向荣】抖音作品解析工具 · 内容仅供学习交流使用</p>

<script>
    const rootUrl = getMainUrl();

    const shareLinkInput = document.getElementById('shareLinkInput');
    const parseBtn = document.getElementById('parseBtn');
    const retryBtn = document.getElementById('retryBtn');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const emptyState = document.getElementById('emptyState');
    const errorMessage = document.getElementById('errorMessage');
    const errorDetail = document.getElementById('errorDetail');
    const errorDetailWrap = document.getElementById('errorDetailWrap');
    const contentContainer = document.getElementById('contentContainer');
    const contentTabs = document.querySelectorAll('.dyx-tab');
    const contentPanels = document.querySelectorAll('.content-panel');
    const authorIntro = document.getElementById('authorIntro');

    const downloadVideoBtn = document.getElementById('downloadVideoBtn');
    const downloadImgBtn = document.getElementById('downloadImageBtn');
    let selectedImgSrc = null;
    let selectedVideoSrc = null;

    let currentVideoData = null;

    // 从标题中提取标签
    function extractTags(title) {
        const tagRegex = /#([^#\s]+)/g;
        const tags = [];
        let match;
        while ((match = tagRegex.exec(title)) !== null) {
            tags.push(match[1]);
        }
        return tags;
    }

    function extractDouyinLink(input) {
        const regex = /https:\/\/[\w.]+\.douyin\.com\/[\w\-/?&=]+/;
        const match = input.match(regex);
        return match ? match[0] : null;
    }

    // 渲染数据到页面
    function renderData(data) {
        currentVideoData = data;
        const hasVideo = !!(data.videos && data.videos.length);
        const hasImage = !!(data.images && data.images.length);
        const hasAudio = !!data.audioUrl;

        document.getElementById("tab-video").classList.toggle("hidden", !hasVideo);
        document.getElementById("tab-image").classList.toggle("hidden", !hasImage);
        document.getElementById("tab-audio").classList.toggle("hidden", !hasAudio);

        renderImageList(data.images);
        renderVideoList(data.videos, data.type === "Video");

        document.getElementById('videoTitle').textContent = data.title || '';
        document.getElementById('videoCreateTime').textContent = data.createTime || '';
        if (hasAudio) {
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.src = data.audioUrl;
            document.getElementById('downloadAudioBtn').title = data.audioUrl;
        }

        // 作者
        document.getElementById('authorAvatar').src = data.author.avatar;
        document.getElementById('authorAvatar').alt = `${data.author.nickname}的头像`;
        document.getElementById('authorName').textContent = data.author.nickname;

        const tagsContainer = document.getElementById('tagsContainer');
        tagsContainer.innerHTML = '';
        if (data.author.id) {
            tagsContainer.appendChild(buildMetaItem('抖音号', data.author.id));
        }
        if (data.author.follower_count) {
            if (tagsContainer.childElementCount) {
                const dot = document.createElement('span');
                dot.className = 'dyx-dot';
                dot.textContent = '·';
                tagsContainer.appendChild(dot);
            }
            tagsContainer.appendChild(buildMetaItem('粉丝', data.author.follower_count));
        }
        if (authorIntro) {
            authorIntro.textContent = data.author.introduction || '';
            authorIntro.classList.toggle('hidden', !data.author.introduction);
        }

        // 统计
        document.getElementById('likeCount').textContent = data.counter.like_count;
        document.getElementById('collectCount').textContent = data.counter.collect_count;
        document.getElementById('shareCount').textContent = data.counter.share_count;
        document.getElementById('commentCount').textContent = data.counter.comment_count;
        document.getElementById('recommendCount').textContent = data.counter.recommend_count;
        document.getElementById('admireCount').textContent = data.counter.admire_count;

        loadingEl.classList.add('hidden');
        errorEl.classList.add('hidden');
        emptyState.classList.add('hidden');
        contentContainer.classList.remove('hidden');

        // 优先展示有内容的标签
        if (hasVideo) {
            document.getElementById("tab-video").click();
        } else if (hasImage) {
            document.getElementById("tab-image").click();
        } else if (hasAudio) {
            document.getElementById("tab-audio").click();
        }
    }

    function buildMetaItem(label, value) {
        const span = document.createElement('span');
        const labelEl = document.createElement('span');
        labelEl.textContent = label + ' ';
        const valueEl = document.createElement('b');
        valueEl.style.fontWeight = '600';
        valueEl.style.color = '#4b5563';
        valueEl.textContent = value;
        span.appendChild(labelEl);
        span.appendChild(valueEl);
        return span;
    }

    // 渲染图片
    function renderImageList(images) {
        const scrollWrap = document.getElementById('imageScrollWrap');
        const navEl = document.getElementById('imageNav');
        const dotsEl = document.getElementById('imageNavDots');
        scrollWrap.innerHTML = '';
        dotsEl.innerHTML = '';
        navEl.classList.add('hidden');
        selectedImgSrc = null;
        if (!images || images.length === 0) return;

        const thumbs = [];

        images.forEach((image, index) => {
            const div = document.createElement('div');
            div.className = 'dyx-thumb';
            const img = document.createElement('img');
            img.src = image.url || '';
            img.alt = `${image.specifications || ""} 图片`;
            img.loading = 'lazy';
            // 图片解码会改变条带宽度，浏览器可能恢复旧的横向偏移，把首图连同左上角序号一起推出可视区
            img.addEventListener('load', () => {
                if (scrollWrap.scrollLeft !== 0) scrollWrap.scrollLeft = 0;
            });
            div.appendChild(img);
            // 与视频页一致：多张图时左上角标「序号 / 总数」
            if (images.length > 1) {
                const badge = document.createElement('span');
                badge.className = 'dyx-media-badge';
                badge.textContent = `${index + 1} / ${images.length}`;
                div.appendChild(badge);
            }
            if (image.specifications) {
                const spec = document.createElement('span');
                spec.className = 'dyx-thumb-spec';
                spec.textContent = image.specifications;
                div.appendChild(spec);
            }
            div.addEventListener('click', () => selectImage(index));
            scrollWrap.appendChild(div);
            thumbs.push(div);
        });

        // 选中第 index 张，并把它滚到条带左端
        let currentIndex = 0;
        function selectImage(index, keepScroll = false) {
            if (index < 0 || index >= thumbs.length) return;
            currentIndex = index;
            thumbs.forEach((el, i) => el.classList.toggle('is-selected', i === index));
            selectedImgSrc = images[index].url;
            dotsEl.querySelectorAll('.dyx-nav-dot').forEach((dot, i) => dot.classList.toggle('is-active', i === index));
            prevArrow.disabled = index === 0;
            nextArrow.disabled = index === thumbs.length - 1;
            const activeDot = dotsEl.querySelector('.dyx-nav-dot.is-active');
            if (activeDot && dotsEl.scrollWidth > dotsEl.clientWidth) {
                dotsEl.scrollLeft = activeDot.offsetLeft - (dotsEl.clientWidth - activeDot.offsetWidth) / 2;
            }
            if (keepScroll) return;
            const delta = thumbs[index].getBoundingClientRect().left - scrollWrap.getBoundingClientRect().left;
            scrollWrap.scrollTo({ left: scrollWrap.scrollLeft + delta - 1, behavior: 'auto' });
        }

        // 多张图时才显示快速定位导航
        if (images.length > 1) {
            navEl.classList.remove('hidden');
            images.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'dyx-nav-dot';
                dot.textContent = `${index + 1}`;
                dot.addEventListener('click', () => selectImage(index));
                dotsEl.appendChild(dot);
            });
        }

        const prevArrow = navEl.querySelector('[data-nav="prev"]');
        const nextArrow = navEl.querySelector('[data-nav="next"]');
        prevArrow.onclick = () => selectImage(currentIndex - 1);
        nextArrow.onclick = () => selectImage(currentIndex + 1);

        selectImage(0, true);
        scrollWrap.scrollLeft = 0;
        requestAnimationFrame(() => { scrollWrap.scrollLeft = 0; });
    }

    // 渲染视频（纵向排列，逐个下滚，避免横向滚动条割裂画面）
    function renderVideoList(videos, isClearError = true) {
        const scrollWrap = document.getElementById('videoScrollWrap');
        scrollWrap.innerHTML = '';
        selectedVideoSrc = null;
        if (!videos || videos.length === 0) return;

        videos.forEach((video, index) => {
            const div = document.createElement('div');
            div.className = 'dyx-media-item';

            const videoEl = document.createElement('video');
            videoEl.src = video.url || '';
            if (video.cover) videoEl.poster = video.cover;
            videoEl.controls = true;
            videoEl.preload = 'metadata';
            div.appendChild(videoEl);

            if (videos.length > 1) {
                const badge = document.createElement('span');
                badge.className = 'dyx-media-badge';
                badge.textContent = `${index + 1} / ${videos.length}`;
                div.appendChild(badge);
            }

            if (isClearError) {
                videoEl.addEventListener('error', () => {
                    const items = Array.from(scrollWrap.querySelectorAll('.dyx-media-item'));
                    if (items.length > 1) {
                        div.remove();
                    } else {
                        videoEl.style.display = 'none';
                        div.style.opacity = '0.4';
                    }
                });
            }

            // 播放互斥
            videoEl.addEventListener('play', () => {
                scrollWrap.querySelectorAll('video').forEach(v => {
                    if (v !== videoEl) v.pause();
                });
            });

            div.addEventListener('click', () => {
                scrollWrap.querySelectorAll('.dyx-media-item').forEach(el => el.classList.remove('is-selected'));
                div.classList.add('is-selected');
                document.getElementById('videoSize').textContent = formatFileSize(video.size);
                document.getElementById('videoSpecifications').textContent = video.specifications || '';
                selectedVideoSrc = video.url;
                scrollWrap.querySelectorAll('video').forEach(v => {
                    if (v !== videoEl) v.pause();
                });
            });

            scrollWrap.appendChild(div);
        });

        scrollWrap.firstElementChild?.click();
    }

    // 下载选中图片
    downloadImgBtn.addEventListener('click', () => {
        if (!selectedImgSrc) {
            UI.alert('请先选择一张图片', {title:'提示', tone:'warn'});
            return;
        }
        downloadFile(selectedImgSrc);
    });

    // 下载选中视频
    downloadVideoBtn.addEventListener('click', () => {
        if (!selectedVideoSrc) {
            UI.alert('请先选择一个视频', {title:'提示', tone:'warn'});
            return;
        }
        let fileName = null;
        try {
            fileName = currentVideoData.author.nickname + " " + currentVideoData.createTime.substring(0, 10) + ".mp4";
        } catch (e) {
            console.error(e);
        }
        downloadFile(selectedVideoSrc, fileName);
    });

    function setBusy(busy) {
        parseBtn.disabled = busy;
        parseBtn.querySelector('span').textContent = busy ? '解析中…' : '解析链接';
        const icon = parseBtn.querySelector('i');
        if (icon) icon.className = busy ? 'fa fa-circle-o-notch fa-spin' : 'fa fa-search';
    }

    // 解析链接
    async function parseLink(link) {
        try {
            link = extractDouyinLink(link);
            if (!link || !isValidUrl(link)) {
                throw new Error('请输入有效的抖音分享链接');
            }

            emptyState.classList.add('hidden');
            loadingEl.classList.remove('hidden');
            errorEl.classList.add('hidden');
            contentContainer.classList.add('hidden');
            setBusy(true);

            document.getElementById("videoScrollWrap").innerHTML = "";
            const audioPlayer = document.getElementById('audioPlayer');
            if (!audioPlayer.paused) {
                audioPlayer.pause();
            }

            const isRefreshChecked = document.getElementById("isRefresh").checked;
            const param = {
                url: link,
                isRefresh: isRefreshChecked
            };
            let url = `${rootUrl}api/videoParsing?${objectToUrlParams(param)}`;
            const response = await publicFetch(url, {
                method: "GET",
                credentials: "include"
            });
            if (response.status === 429) {
                const retryAfter = response.headers.get("Retry-After");
                throw new Error("解析请求过于频繁" + (retryAfter ? "，请 " + retryAfter + " 秒后再试" : "，请稍后再试"));
            }
            if (response.status === 401 || response.status === 403) {
                throw new Error("接口暂不可用，请稍后重试");
            }
            const data = await response.json();

            if (data.code !== 0) {
                const err = new Error(data.message || "解析失败，请稍后重试");
                err.detail = typeof data.data === "string" ? data.data : "";
                throw err;
            }
            renderData(data.data);

        } catch (error) {
            console.error('解析失败:', error);
            loadingEl.classList.add('hidden');
            emptyState.classList.add('hidden');
            contentContainer.classList.add('hidden');
            errorEl.classList.remove('hidden');
            errorMessage.textContent = error.message || '解析链接失败，请检查链接是否有效';
            // 技术详情（异常链）默认折叠，只有真的带上来才显示折叠入口
            const detailText = normalizeExceptionText(error.detail || "");
            if (errorDetailWrap && errorDetail) {
                errorDetail.textContent = detailText;
                // 清洗后如果就是这句人话，再折叠也没信息量，直接不显示入口
                const duplicated = !detailText || detailText === errorMessage.textContent.trim();
                errorDetailWrap.classList.toggle("hidden", duplicated);
                errorDetailWrap.open = false;
            }
        } finally {
            setBusy(false);
        }
    }

    /**
     * 把后端抛上来的异常链整理成人能读的样子：
     * ExecutionException: java.util.concurrent.ExecutionException: java.lang.RuntimeException: xxx ← RuntimeException: xxx
     * 统一去掉类名包装、去掉重复段落，只留「→ 根因」。
     */
    function normalizeExceptionText(text) {
        if (!text) return "";
        let s = String(text).replace(/\s+/g, " ").trim();
        // 去掉任何「包名.XxxException:」前缀，包括 ExecutionException / RuntimeException 这层包装
        s = s.replace(/(?:(?:java|javax|cn|com|org)(?:\.\w+)*\.)?\w+Exception\s*:\s*/g, "");
        // 后端会拼 "← 根因 ← 根因"，只保留最后一层（最内层原因）
        const parts = s.split("←").map(p => p.trim()).filter(Boolean);
        const innermost = parts.length ? parts[parts.length - 1] : s;
        return innermost || s;
    }

    function isValidUrl(url) {
        try {
            new URL(url);
            return true;
        } catch (e) {
            return false;
        }
    }

    // 切换标签
    function switchTab(tabName) {
        contentTabs.forEach(tab => {
            tab.classList.toggle('is-active', tab.dataset.tab === tabName);
        });
        contentPanels.forEach(panel => {
            panel.classList.toggle('hidden', panel.id !== `${tabName}Tab`);
        });
        if (tabName === 'image') {
            // 切回图片 tab 时把条带复位，避免残留的横向偏移把首图序号挤出可视区
            const wrap = document.getElementById('imageScrollWrap');
            if (wrap) wrap.scrollLeft = 0;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        parseBtn.addEventListener('click', () => {
            parseLink(shareLinkInput.value.trim());
        });

        shareLinkInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                parseLink(shareLinkInput.value.trim());
            }
        });

        retryBtn.addEventListener('click', () => {
            parseLink(shareLinkInput.value.trim());
        });

        contentTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                switchTab(tab.dataset.tab);
            });
        });

        const urlParams = new URLSearchParams(window.location.search);
        let shared = urlParams.get("shared");
        if (shared) {
            shared = shared.startsWith("http")
                ? decodeURIComponent(shared)
                : atob(shared);
            shareLinkInput.value = shared;
            parseBtn.click();
        }

        const audio = document.getElementById('audioPlayer');
        audio.addEventListener('error', (e) => {
            console.error('音频加载失败:', e);
        });

        document.getElementById('downloadAudioBtn').addEventListener('click', () => {
            if (currentVideoData) {
                let fileName = null;
                try {
                    fileName = currentVideoData.author.nickname + " " + currentVideoData.createTime.substring(0, 10) + ".mp3";
                } catch (e) {
                    console.error(e);
                }
                downloadFile(currentVideoData.audioUrl, fileName);
            }
        });
    });

    function downloadFile(url, fileName) {
        const link = document.createElement('a');
        link.target = "_blank";
        link.rel = "noreferrer noopener";
        link.href = url;
        if (fileName) {
            link.download = fileName;
            copyToClipboard(fileName);
            UI.alert("下载文件名已复制到剪贴板", {title:"已复制", tone:"success"});
        }
        document.body.appendChild(link);
        link.click();
        console.log("文件下载", url, fileName);
        document.body.removeChild(link);
    }
</script>
</body>
</html>
