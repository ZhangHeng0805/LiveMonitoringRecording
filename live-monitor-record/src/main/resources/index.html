    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }

            .status-badge {
                @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium;
            }

            .animate-fade {
                animation: fadeIn 0.3s ease-in-out;
            }

            .animate-pulse-slow {
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }

            .skeleton {
                background: linear-gradient(
                        90deg,
                        #f0f0f0 25%,
                        #e0e0e0 50%,
                        #f0f0f0 75%
                );
                background-size: 200% 100%;
                animation: shimmer 1.5s infinite;
            }

            .btn-refresh-active {
                transform: rotate(360deg);
                transition: transform 0.5s ease-in-out;
            }

            .modal-backdrop {
                @apply fixed inset-0 bg-black/50 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300;
            }

            .modal-backdrop.active {
                @apply opacity-100 pointer-events-auto;
            }

            .modal-box {
                @apply bg-white rounded-lg shadow-xl w-full max-w-lg mx-4 transform transition-all duration-300 scale-95 opacity-0;
            }

            .modal-backdrop.active .modal-box {
                @apply scale-100 opacity-100;
            }

            .btn {
                @apply px-4 py-2 rounded-md font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2;
            }

            .input-field {
                @apply w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
    <!-- 页面自有样式：lml- 前缀，卡片与面板的统一视觉层 -->
    <style>
        :root {
            --lml-primary: #6366f1;
            --lml-primary-soft: rgba(99, 102, 241, .12);
            --lml-text: #1f2430;
            --lml-text-2: #5b6272;
            --lml-text-3: #98a0ae;
            --lml-line: #ecedf1;
            --lml-bg: #f4f5f8;
            --lml-ok: #16a34a;
            --lml-warn: #d97706;
            --lml-danger: #dc2626;
        }

        html, body { background: var(--lml-bg); }

        body.lml-body {
            margin: 0;
            padding: 26px 18px 0;
            color: var(--lml-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .lml-wrap { max-width: 78rem; margin: 0 auto; padding-bottom: 2rem; }

        .is-hidden { display: none !important; }

        /* ---------- 页头 ---------- */
        .lml-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: .9rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .lml-brand { display: flex; align-items: center; gap: .8rem; min-width: 0; }

        .lml-logo {
            flex: none;
            width: 2.9rem;
            height: 2.9rem;
            border-radius: .8rem;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 1.25rem;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            box-shadow: 0 6px 16px rgba(99, 102, 241, .28);
        }

        .lml-title { margin: 0; font-size: 1.28rem; font-weight: 700; letter-spacing: .01em; }
        .lml-subtitle { margin: .18rem 0 0; font-size: .8rem; color: var(--lml-text-3); }

        .lml-statusbar {
            display: flex;
            align-items: center;
            gap: .45rem;
            padding: .45rem .5rem .45rem .7rem;
            background: #fff;
            border: 1px solid var(--lml-line);
            border-radius: .6rem;
            box-shadow: 0 1px 2px rgba(24, 30, 48, .04);
            font-size: .74rem;
            color: var(--lml-text-2);
            flex-wrap: wrap;
        }

        .lml-statusbar .fa-clock-o { color: var(--lml-primary); }
        .lml-update-time { font-weight: 600; color: var(--lml-text); }

        .lml-refresh-flag { display: inline-flex; align-items: center; gap: .25rem; font-size: .72rem; }
        .lml-refresh-flag.is-ok { color: var(--lml-ok); }
        .lml-refresh-flag.is-error { color: var(--lml-danger); }
        .lml-refresh-flag.is-loading { color: var(--lml-primary); }

        .lml-sep { width: 1px; height: 1rem; background: var(--lml-line); }

        .lml-icon-btn {
            width: 1.9rem;
            height: 1.9rem;
            display: inline-grid;
            place-items: center;
            border: 1px solid transparent;
            border-radius: .45rem;
            background: transparent;
            color: var(--lml-primary);
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }

        .lml-icon-btn:hover { background: var(--lml-primary-soft); }
        .lml-icon-btn.is-danger { color: var(--lml-danger); }
        .lml-icon-btn.is-danger:hover { background: rgba(220, 38, 38, .1); }

        .lml-icon-btn.btn-refresh-active { transform: rotate(360deg); transition: transform .5s ease-in-out; }

        /* ---------- 概览 ---------- */
        .lml-overview {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: .8rem;
            margin-bottom: .9rem;
        }

        .lml-stat {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
            padding: .8rem 1rem;
            background: #fff;
            border: 1px solid var(--lml-line);
            border-radius: .8rem;
            box-shadow: 0 1px 2px rgba(24, 30, 48, .04), 0 12px 26px -20px rgba(24, 30, 48, .18);
        }

        .lml-stat-label { margin: 0; font-size: .74rem; color: var(--lml-text-3); }
        .lml-stat-value { margin: .18rem 0 0; font-size: 1.5rem; font-weight: 700; line-height: 1.15; }
        .lml-stat-value.is-ok { color: var(--lml-ok); }
        .lml-stat-value.is-primary { color: var(--lml-primary); }

        .lml-stat-icon {
            flex: none;
            width: 2.5rem;
            height: 2.5rem;
            display: grid;
            place-items: center;
            border-radius: .7rem;
            font-size: 1rem;
            background: var(--lml-primary-soft);
            color: var(--lml-primary);
        }

        .lml-stat-icon.is-ok { background: rgba(22, 163, 74, .12); color: var(--lml-ok); }

        /* ---------- 工具条 ---------- */
        .lml-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
            flex-wrap: wrap;
            margin-bottom: 1.4rem;
        }

        .lml-toolbar-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

        .lml-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .35rem;
            height: 2.3rem;
            padding: 0 .9rem;
            font-family: inherit;
            font-size: .8rem;
            font-weight: 600;
            border: 1px solid transparent;
            border-radius: .55rem;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }

        .lml-btn-primary {
            color: #fff;
            background: var(--lml-primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, .22);
        }

        .lml-btn-primary:hover { background: #5457e6; }

        .lml-btn-ghost {
            color: var(--lml-text-2);
            background: #fff;
            border-color: var(--lml-line);
        }

        .lml-btn-ghost:hover { color: var(--lml-primary); border-color: rgba(99, 102, 241, .35); }

        .lml-hint { font-size: .72rem; color: var(--lml-text-3); }

        /* ---------- 搜索 ---------- */
        .lml-search {
            position: relative;
            flex: 0 1 22rem;
            min-width: 12rem;
            display: flex;
            align-items: center;
        }

        .lml-search > i {
            position: absolute;
            left: .65rem;
            font-size: .78rem;
            color: #b6bcc9;
            pointer-events: none;
        }

        .lml-search input {
            width: 100%;
            height: 2.3rem;
            padding: 0 2rem 0 1.9rem;
            font-family: inherit;
            font-size: .78rem;
            color: var(--lml-text);
            background: #fff;
            border: 1px solid var(--lml-line);
            border-radius: .55rem;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .lml-search input::placeholder { color: #b3b9c6; }

        .lml-search input:focus {
            border-color: var(--lml-primary);
            box-shadow: 0 0 0 3px var(--lml-primary-soft);
        }

        .lml-search-clear {
            position: absolute;
            right: .35rem;
            width: 1.5rem;
            height: 1.5rem;
            display: none;
            place-items: center;
            color: #b6bcc9;
            background: transparent;
            border: none;
            border-radius: .3rem;
            cursor: pointer;
            font-size: .72rem;
        }

        .lml-search-clear:hover { color: var(--lml-text-2); background: #f2f3f7; }
        .lml-search.has-value .lml-search-clear { display: grid; }

        .lml-search-count { font-size: .72rem; color: var(--lml-text-3); white-space: nowrap; }

        /* ---------- 分区标题 ---------- */
        .lml-section { margin-bottom: 1.6rem; }

        .lml-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
            margin-bottom: .7rem;
        }

        .lml-section-title {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            margin: 0;
            font-size: .95rem;
            font-weight: 700;
        }

        .lml-dot {
            display: inline-grid;
            place-items: center;
            width: .5rem;
            height: .5rem;
            border-radius: 50%;
            background: #cbd0da;
        }

        .lml-dot.is-live { background: var(--lml-ok); box-shadow: 0 0 0 3px rgba(22, 163, 74, .14); }

        .lml-section-count { font-size: .74rem; color: var(--lml-text-3); }

        .lml-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            align-items: start;
        }

        /* ---------- 房间卡片 ---------- */
        .lml-card {
            background: #fff;
            border: 1px solid var(--lml-line);
            border-radius: .9rem;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(24, 30, 48, .04), 0 14px 30px -22px rgba(24, 30, 48, .22);
            transition: transform .18s ease, box-shadow .18s ease;
            animation: lml-fade .28s ease both;
        }

        @keyframes lml-fade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        .lml-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 4px rgba(24, 30, 48, .05), 0 18px 34px -20px rgba(24, 30, 48, .26);
        }

        /* 直播中：绿色顶条 + 淡绿头部，整卡更“亮” */
        .lml-card.is-live {
            border-color: rgba(22, 163, 74, .26);
            box-shadow: 0 1px 2px rgba(22, 163, 74, .1), 0 14px 30px -20px rgba(22, 163, 74, .35);
        }

        .lml-card.is-live::before {
            content: "";
            display: block;
            height: 3px;
            background: linear-gradient(90deg, #22c55e, #86efac);
        }

        .lml-card.is-live .lml-card-head {
            background: linear-gradient(180deg, #f1fbf4 0%, #fcfefd 100%);
            border-bottom-color: #e6f4ec;
        }

        /* 录制中：左侧主色竖条，一眼区分“在录” */
        .lml-card.is-recording { position: relative; }

        .lml-card.is-recording::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #818cf8, #6366f1);
        }

        /* 离线：整体去饱和，缩后一档 */
        .lml-card.is-offline { background: #fcfcfd; border-color: #e9ebf1; }

        /* 未直播封面：不加任何滤镜（完整展示与高度封顶已在 .lml-cover 统一处理） */

        .lml-card.is-offline .lml-card-head {
            background: linear-gradient(180deg, #f5f6f9 0%, #fbfbfd 100%);
            border-bottom-color: #eceef3;
        }

        .lml-card.is-offline .lml-nickname { color: var(--lml-text-2); }

        .lml-card.is-offline::before {
            content: "";
            display: block;
            height: 3px;
            background: linear-gradient(90deg, #dfe2ea, #f0f1f5);
        }

        .lml-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: .6rem;
            padding: .8rem .9rem .7rem;
            border-bottom: 1px solid var(--lml-line);
            background: #fbfbfe;
        }

        .lml-author { display: flex; align-items: center; gap: .6rem; min-width: 0; }

        .lml-avatar {
            flex: none;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            object-fit: cover;
            background: #eef0f5;
            display: grid;
            place-items: center;
            color: var(--lml-text-3);
            font-size: 1rem;
        }

        .lml-author-meta { min-width: 0; }

        .lml-nickname {
            margin: 0;
            font-size: .86rem;
            font-weight: 700;
            color: var(--lml-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 16rem;
        }

        .lml-chips { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .3rem; }

        .lml-chip {
            display: inline-flex;
            align-items: center;
            gap: .2rem;
            padding: .1rem .4rem;
            font-size: .66rem;
            color: var(--lml-text-2);
            background: #f4f5f8;
            border: 1px solid #eceef4;
            border-radius: .3rem;
            white-space: nowrap;
        }

        .lml-chip.is-platform {
            color: var(--lml-primary);
            background: var(--lml-primary-soft);
            border-color: rgba(99, 102, 241, .18);
            font-weight: 600;
        }

        /* 平台色：抖音靛、B站粉、快手橙 */
        .lml-chip.is-douyin { color: #4f46e5; background: rgba(99, 102, 241, .12); border-color: rgba(99, 102, 241, .22); }
        .lml-chip.is-bili { color: #d6336c; background: rgba(214, 51, 108, .1); border-color: rgba(214, 51, 108, .22); }
        .lml-chip.is-ks { color: #c2410c; background: rgba(234, 88, 12, .1); border-color: rgba(234, 88, 12, .22); }

        .lml-badge {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            padding: .22rem .5rem;
            font-size: .7rem;
            font-weight: 600;
            border-radius: .4rem;
            white-space: nowrap;
        }

        .lml-badge.is-live { color: #15803d; background: rgba(22, 163, 74, .12); }
        .lml-badge.is-offline { color: var(--lml-text-2); background: #f1f2f6; }
        .lml-badge.is-recording { color: #b42318; background: rgba(220, 38, 38, .1); }
        .lml-badge.is-recording .fa-circle { animation: lml-blink 1.2s ease-in-out infinite; }

        @keyframes lml-blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        .lml-badge .fa-circle { font-size: .55rem; }
        .lml-badge.is-live .fa-circle { animation: lml-pulse 1.8s ease-in-out infinite; }

        @keyframes lml-pulse { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }

        .lml-badge .lml-mini-refresh {
            display: inline-grid;
            place-items: center;
            width: 1.2rem;
            height: 1.2rem;
            margin-left: .1rem;
            color: inherit;
            background: transparent;
            border: none;
            border-radius: .25rem;
            cursor: pointer;
            opacity: .75;
            font-size: .7rem;
        }

        .lml-badge .lml-mini-refresh:hover { opacity: 1; background: rgba(0, 0, 0, .05); }

        .lml-card-body { padding: .8rem .9rem .9rem; }

        .lml-main { display: flex; gap: .8rem; margin-bottom: .75rem; }

        /* 封面统一风格：不裁剪、完整展示，但限制最高比例（约 1.3 倍宽度） */
        .lml-cover {
            position: relative;
            flex: none;
            width: 11.5rem;
            height: auto;
            min-height: 6.5rem;
            border-radius: .55rem;
            overflow: hidden;
            background: #f1f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lml-cover img {
            width: 100%;
            height: auto;
            max-height: 15rem; /* 11.5rem × 1.3，超高的竖屏图在此封顶，contain 保证不裁 */
            object-fit: contain;
            display: block;
        }

        .lml-cover-empty {
            width: 100%;
            height: 6.5rem;
            display: grid;
            place-items: center;
            color: #b3b9c6;
            font-size: 1.6rem;
        }

        .viewer-count {
            position: absolute;
            right: .35rem;
            bottom: .35rem;
            padding: .08rem .35rem;
            font-size: .66rem;
            color: #fff;
            background: rgba(15, 17, 21, .66);
            border-radius: .25rem;
        }

        .lml-detail { flex: 1 1 auto; min-width: 0; }

        .lml-room-title {
            margin: 0 0 .4rem;
            font-size: .82rem;
            font-weight: 600;
            color: var(--lml-text);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .lml-room-title.is-offline { color: var(--lml-text-3); font-weight: 500; }

        .lml-info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: .3rem .7rem;
            font-size: .72rem;
            color: var(--lml-text-2);
        }

        .lml-info-item { display: flex; align-items: center; gap: .3rem; min-width: 0; }
        .lml-info-item > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lml-info-item i { flex: none; width: .85rem; color: #b6bcc9; font-size: .74rem; }
        .lml-info-item i.is-accent { color: var(--lml-primary); }
        .lml-info-item i.is-like { color: #ef4444; }

        .lml-flagnum {
            padding: .05rem .3rem;
            margin-left: .2rem;
            border-radius: .25rem;
            font-size: .68rem;
        }

        .lml-flagnum.is-on { color: #15803d; background: rgba(22, 163, 74, .12); }
        .lml-flagnum.is-off { color: #b42318; background: rgba(220, 38, 38, .1); }

        /* 录制信息块 */
        .lml-record {
            padding: .6rem .7rem;
            margin-bottom: .75rem;
            background: #f8f9fc;
            border: 1px solid #eef0f5;
            border-radius: .55rem;
        }

        .lml-record.is-recording {
            background: #f7f8ff;
            border-color: rgba(99, 102, 241, .2);
        }

        .lml-record-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            flex-wrap: wrap;
        }

        .lml-record-name {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            font-size: .74rem;
            font-weight: 600;
            color: var(--lml-text-3);
        }

        .lml-record.is-recording .lml-record-name { color: var(--lml-primary); }

        .lml-record-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: .25rem .6rem;
            margin-top: .45rem;
            font-size: .7rem;
            color: var(--lml-text-2);
        }

        .lml-path {
            display: flex;
            align-items: center;
            gap: .3rem;
            margin-top: .4rem;
            font-size: .68rem;
            color: var(--lml-text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lml-act.is-primary {

        .lml-drop-toggle {

        /* ---------- 页脚 ---------- */

        .lml-footer-links a { display: inline-flex; align-items: center; gap: .25rem; }

        /* ---------- 响应式 ---------- */

        @media (max-width: 720px) {

<!-- JavaScript 功能实现 -->
<script>
    const fullUrl = window.location.href;
    const MainUrl = getMainUrl(fullUrl);

    function generateLink(links) {
        let html = "<span>相关链接：</span>";
        Object.keys(links).forEach((key) => {
            html += `<a href="${links[key]}" target="_blank"><i class="fa fa-link"></i>${key}</a>`;
        });
        return html;
    }

    // 配置参数
    const REFRESH_INTERVAL = 30; // 刷新间隔（秒）
    const platformName = {
        DouYin: "抖音",
        Bili: "Bilibili",
        KuaiShou: "快手",
    };
    let refreshTimer = null;
    let isRefreshing = false; // 标记是否正在刷新中
    document.getElementById("other-links").innerHTML = generateLink({
        抖音作品解析:
            "DouYinVideoPares.html?url=" + encodeURIComponent(MainUrl),
        FLV视频播放器: "https://zhangheng0805.github.io/FLVPlayer/",
    });
    // 页面加载完成后初始化
    document.addEventListener("DOMContentLoaded", function () {
        // 初始化显示刷新间隔
        document.getElementById("refresh-interval").textContent =
            REFRESH_INTERVAL;
        // 绑定手动刷新按钮事件
        const refreshBtn = document.getElementById("manual-refresh-btn");
        refreshBtn.addEventListener("click", handleManualRefresh);
        // 绑定退出程序按钮事件
        const exitBtn = document.getElementById("exit-app-btn");
        if (exitBtn) {
            exitBtn.addEventListener("click", handleExitProgram);
        }
        // 卡片按钮统一走事件委托
        initRoomCardActions();
        // 直播间模糊检索
        initRoomSearch();
        // 首次进入先展示骨架屏
        renderSkeleton("living-rooms-container");
        renderSkeleton("not-living-rooms-container");
        refreshClient();
        // 首次加载数据（若首屏先到 403，fetchData 内部会自动续期并重试一次）
        fetchData();
        // 设置定时刷新
        startRefreshTimer();
    });

    // 退出整个程序：二次确认 → 输入操作秘钥 → 调 action/exit（秘钥错误由接口拒绝并提示）
    function handleExitProgram() {
        if (!confirm("退出后所有直播监听都会停止，且网页服务一并关闭。确定要退出整个程序吗？")) {
            return;
        }
        showActionBeforeModal(function (key) {
            getRequest("action/exit", {actionKey: key})
                .then(function (msg) {
                    if (msg.success) {
                        setModalContent(
                            "程序已退出",
                            `<p class="text-center text-green-600 mb-1">${escapeHtml(msg.message || "程序已退出")}</p>
                             <p class="text-center text-xs text-gray-500">本页面已与服务断开，3 秒后自动关闭。</p>`,
                            [{
                                text: "关闭页面",
                                className: "bg-primary text-white hover:bg-primary/90 focus:ring-primary",
                                onClick: function () {
                                    window.close();
                                },
                            }]
                        );
                        setTimeout(function () {
                            try {
                                window.close();
                            } catch (e) {
                            }
                        }, 3000);
                    } else {
                        // 秘钥错误 / 接口异常，弹结果提示
                        showActionAfterModal(msg);
                    }
                })
                .catch(function () {
                    // 服务已在退出时连接会被重置，忽略即可
                });
        });
    }

    // 骨架屏（两个列表共用一份模板，避免在 HTML 里重复两段静态结构）
    function renderSkeleton(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = `
            <div class="lml-card">
                <div class="lml-card-head">
                    <div class="lml-author">
                        <div class="lml-skel" style="width:2.5rem;height:2.5rem;border-radius:50%"></div>
                        <div class="lml-author-meta">
                            <div class="lml-skel" style="width:8rem;height:.9rem"></div>
                            <div class="lml-skel" style="width:12rem;height:.55rem;margin-top:.4rem"></div>
                        </div>
                    </div>
                    <div class="lml-skel" style="width:4.2rem;height:1.1rem"></div>
                </div>
                <div class="lml-card-body">
                    <div class="lml-main">
                        <div class="lml-skel" style="width:11.5rem;height:6.5rem"></div>
                        <div class="lml-detail">
                            <div class="lml-skel" style="width:100%;height:.8rem"></div>
                            <div class="lml-skel" style="width:70%;height:.8rem;margin-top:.35rem"></div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.6rem">
                                <div class="lml-skel" style="height:.55rem"></div>
                                <div class="lml-skel" style="height:.55rem"></div>
                                <div class="lml-skel" style="height:.55rem"></div>
                                <div class="lml-skel" style="height:.55rem"></div>
                            </div>
                        </div>
                    </div>
                    <div class="lml-skel" style="width:100%;height:2.6rem;margin-bottom:.7rem"></div>
                    <div style="display:flex;gap:.4rem">
                        <div class="lml-skel" style="width:5.5rem;height:1.6rem"></div>
                        <div class="lml-skel" style="width:5.5rem;height:1.6rem"></div>
                        <div class="lml-skel" style="width:5.5rem;height:1.6rem"></div>
                    </div>
                </div>
            </div>`;
    }

    // 处理手动刷新
    function handleManualRefresh() {
        // 如果正在刷新中，则不重复触发
        if (isRefreshing) return;

        // 点击时添加旋转动画
        const refreshIcon = document.querySelector("#manual-refresh-btn i");
        refreshIcon.classList.add("btn-refresh-active");

        // 触发数据刷新
        fetchData(true).then(() => {
            // 动画完成后移除类
            setTimeout(() => {
                refreshIcon.classList.remove("btn-refresh-active");
            }, 500);
        });
    }

    // 开始定时刷新
    function startRefreshTimer() {
        // 清除已有定时器
        if (refreshTimer) {
            clearInterval(refreshTimer);
        }
        // 设置新定时器
        refreshTimer = setInterval(fetchData, REFRESH_INTERVAL * 1000);
    }

    let sessionExpiredShown = false;

    // 取数：公开只读，陌生人无需秘钥即可看到房间列表；
    // 后端关闭 server.auth.publicRead 时会 403，publicFetch 自动退回带令牌请求并弹秘钥框
    async function requestRooms(isManual, signal) {
        return publicFetch(MainUrl + "api/rooms?manual=" + isManual, {
            signal: signal,
            credentials: "include"
        });
    }

    // 获取数据
    async function fetchData(isManual = false) {
        // 如果正在刷新中，则不重复触发
        if (isRefreshing) return;

        isRefreshing = true;
        showRefreshStatus("loading");

        let timeoutId = null;
        try {
            // 发起API请求并设置超时
            const controller = new AbortController();
            timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时

            const response = await requestRooms(isManual, controller.signal);

            if (response.status === 403) {
                showRefreshStatus("error");
                // 已自动换令牌仍被拒：多半是秘钥失效/服务端重启，只提示一次，可重新输入秘钥
                if (!sessionExpiredShown) {
                    sessionExpiredShown = true;
                    setModalContent(
                        "访问被拒绝",
                        `<p class="text-center text-sm text-gray-600">接口令牌已失效或操作秘钥不正确。</p>
                         <p class="text-center text-xs text-gray-500 mt-1">点击「输入秘钥重试」重新换取令牌，无需刷新页面。</p>`,
                        [
                            {
                                text: "关闭",
                                className: "bg-gray-200 text-gray-800 hover:bg-gray-300 focus:ring-gray-400",
                                onClick: closeModal,
                            },
                            {
                                text: "输入秘钥重试",
                                className: "bg-primary text-white hover:bg-primary/90 focus:ring-primary",
                                onClick: function () {
                                    closeModal();
                                    sessionExpiredShown = false;
                                    clearApiToken();
                                    if (typeof window.promptActionKey === "function") {
                                        window.promptActionKey().then(function (key) {
                                            if (key) fetchData(true);
                                        });
                                    }
                                },
                            },
                        ]
                    );
                }
                return;
            }
            // 检查响应状态
            if (!response.ok) {
                throw new Error(
                    `网络响应错误: ${response.status} ${response.statusText}`
                );
            }

            // 解析JSON数据
            const data = await response.json();

            if (data.code !== 0) {
                throw new Error(`数据返回错误: ${data.message || "未知错误"}`);
            }

            updateUI(data);
            showRefreshStatus("success");
        } catch (error) {
            // 区分不同类型的错误
            let errorMessage = "获取数据失败";
            if (error.name === "AbortError") {
                errorMessage = "请求超时";
            } else if (error.message) {
                errorMessage = error.message;
            }

            console.error(errorMessage, error);
            showRefreshStatus("error");
        } finally {
            // 无论成功失败都清掉超时定时器，避免定时器泄漏
            if (timeoutId) clearTimeout(timeoutId);
            // 无论成功失败，都标记为不在刷新中
            isRefreshing = false;
        }
    }

    // 显示刷新状态
    function showRefreshStatus(status) {
        // 隐藏所有状态
        document.getElementById("refresh-indicator").classList.add("is-hidden");
        document.getElementById("refresh-success").classList.add("is-hidden");
        document.getElementById("refresh-error").classList.add("is-hidden");

        // 显示指定状态
        if (status === "loading") {
            document
                .getElementById("refresh-indicator")
                .classList.remove("is-hidden");
        } else if (status === "success") {
            document.getElementById("refresh-success").classList.remove("is-hidden");
            // 3秒后隐藏成功提示
            setTimeout(() => {
                document.getElementById("refresh-success").classList.add("is-hidden");
            }, 3000);
        } else if (status === "error") {
            document.getElementById("refresh-error").classList.remove("is-hidden");
        }
    }

    // 上一次渲染的数据指纹：数据没变化时只更新时间，不重建整个列表（避免每 30 秒闪一次）
    let lastRoomsSignature = "";

    // 更新界面
    function updateUI(data) {
        const list = Array.isArray(data.data) ? data.data : [];

        // 更新时间显示
        document.getElementById("update-time").textContent = data.time || "";
        document.getElementById("footer-update-time").textContent = data.time || "";

        const signature = JSON.stringify(list);
        if (signature === lastRoomsSignature) {
            return;
        }
        lastRoomsSignature = signature;

        // 供事件委托按 key 反查房间对象
        cacheRooms(list);

        // 统计数据
        const totalRooms = list.length;
        const livingRooms = list.filter(
            (item) => item["room-status"] === "LIVING"
        ).length;
        const notLivingRooms = totalRooms - livingRooms;
        const recordingRooms = list.filter(
            (item) => item.recorder !== undefined && item.recorder.isRecord
        ).length;

        // 更新统计数字
        updateCounter("total-rooms", totalRooms);
        updateCounter("living-rooms", livingRooms);
        updateCounter("recording-rooms", recordingRooms);
        document.getElementById(
            "living-count"
        ).textContent = `${livingRooms} 个房间`;
        document.getElementById(
            "not-living-count"
        ).textContent = `${notLivingRooms} 个房间`;

        // 更新直播中房间列表
        const livingContainer = document.getElementById("living-rooms-container");
        livingContainer.innerHTML = "";

        // 更新未直播房间列表
        const notLivingContainer = document.getElementById("not-living-rooms-container");
        notLivingContainer.innerHTML = "";

        // 处理每个房间数据（用 DocumentFragment 一次性插入，减少重排）
        const livingFragment = document.createDocumentFragment();
        const notLivingFragment = document.createDocumentFragment();
        list.forEach((item, index) => {
            if (item["room-status"] === "LIVING") {
                livingFragment.appendChild(createLivingRoomElement(item, index));
            } else {
                notLivingFragment.appendChild(createNotLivingRoomElement(item, index));
            }
        });
        livingContainer.appendChild(livingFragment);
        notLivingContainer.appendChild(notLivingFragment);

        // 如果没有数据，显示提示
        if (livingRooms === 0) {
            livingContainer.innerHTML =
                '<div class="lml-empty">暂无直播中的房间</div>';
        }

        if (notLivingRooms === 0) {
            notLivingContainer.innerHTML =
                '<div class="lml-empty">暂无未直播的房间</div>';
        }

        // 数据刷新后沿用当前检索关键词，避免过滤状态被重置
        if (typeof applyRoomFilter === "function") {
            applyRoomFilter();
        }
    }

    // 获取弹窗元素
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalFooter = document.getElementById("modalFooter");
    const modalClose = document.getElementById("modalClose");

    modalClose.addEventListener("click", closeModal);

    // 弹窗关闭通知：右上角 ✕ 直接关掉时，也要让「操作验证」这类 Promise 弹窗收到取消信号，
    // 否则 promptActionKey 会一直挂着不 resolve，后续接口取不到令牌也不会再弹框。
    const modalDismissHandlers = new Set();
    window.onModalDismiss = function (fn) {
        if (typeof fn === "function") modalDismissHandlers.add(fn);
    };
    window.offModalDismiss = function (fn) {
        modalDismissHandlers.delete(fn);
    };

    // 打开弹窗
    function openModal() {
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
    }

    // 关闭弹窗
    function closeModal() {
        modal.classList.remove("active");
        document.body.style.overflow = "";
        if (!modalDismissHandlers.size) return;
        const handlers = Array.from(modalDismissHandlers);
        // 延迟到微任务：点「确定」时是先 closeModal() 再执行 onSubmit，
        // 这样提交结果能先落地，不会被误判成“用户取消”。
        Promise.resolve().then(function () {
            handlers.forEach(function (fn) {
                try {
                    fn();
                } catch (e) {
                }
            });
        });
    }

    // 清除弹窗内容
    function clearModalContent() {
        modalTitle.textContent = "";
        modalBody.innerHTML = "";
        modalFooter.innerHTML = "";
    }

    // 添加按钮到弹窗底部
    function addModalButton(text, className, onClick) {
        const button = document.createElement("button");
        button.textContent = text;
        button.className = `btn ${className}`;
        button.addEventListener("click", debounce(onClick, 300, true));
        modalFooter.appendChild(button);
        return button;
    }

    // 设置弹窗内容
    // options: { maxWidth: '56rem', hint: '共 45 个' }
    function setModalContent(title, content, buttons = [], options = {}) {
        clearModalContent();

        // 设置标题（可选右侧补充说明）
        const hint = options.hint
            ? `<span class="ml-2 text-xs font-normal text-gray-400">${escapeHtml(options.hint)}</span>`
            : "";
        modalTitle.innerHTML = `${escapeHtml(title)}${hint}`;

        // 不同弹窗内容宽度差异很大，允许调用方指定
        const modalBox = modal.querySelector(".modal-box");
        modalBox.style.maxWidth = options.maxWidth || "";

        // 设置内容（支持HTML）
        modalBody.innerHTML = content;

        // 添加按钮
        buttons.forEach((btn) => {
            addModalButton(btn.text, btn.className, btn.onClick);
        });

        openModal();
    }
</script>
</body>

</html>
