syntax = "proto3";
package douyin;

option java_package = "cn.zhangheng.record";
option java_outer_classname = "DouyinMessageOuter";

message Response {
  repeated Message messagesList = 1;
  string cursor = 2;
  uint64 fetchInterval = 3;
  uint64 now = 4;
  string internalExt = 5;
  uint32 fetchType = 6;
  map<string, string> routeParams = 7;
  uint64 heartbeatDuration = 8;
  bool needAck = 9;
  string pushServer = 10;
  string liveCursor = 11;
  bool historyNoMore = 12;
}

message Message{
  string method = 1;
  bytes payload = 2;
  int64 msgId = 3;
  int32 msgType = 4;
  bool needWrdsStore = 6;
  int64 wrdsVersion = 7;
  string wrdsSubKey = 8;
}

message PushFrame {
  uint64 seqId = 1;
  uint64 logId = 2;
  uint64 service = 3;
  uint64 method = 4;
  repeated HeadersList headersList = 5;
  string payloadEncoding = 6;
  string payloadType = 7;
  bytes payload = 8;
}

message HeadersList {
  string key = 1;
  string value = 2;
}

message User {
  uint64 id = 1;
  uint64 shortId = 2;
  string nickName = 3;
  uint32 gender = 4;
  //  string Signature = 5;
  //  uint32 Level = 6;
  //  uint64 Birthday = 7;
  //  string Telephone = 8;
  //  string city = 14;
  FollowInfo FollowInfo = 22;
  PayGrade PayGrade = 23;
  FansClub FansClub = 24;
  //  uint32 ageRange = 1045;
  //  string idStr = 1028;

}
//消费等级
message PayGrade {
  int64 level = 6;
}
//粉丝团
message FansClub {
  FansClubData data = 1;
  message FansClubData {
    string clubName = 1;
    int32 level = 2;
  }
}
message FollowInfo {
  uint64 followingCount = 1;//关注数
  uint64 followerCount = 2;//粉丝数
}


//聊天信息
message ChatMessage {
  User user = 2;
  string content = 3;
  bool visibleToSender = 4;
  uint64 eventTime = 15;
}
// 礼物消息
message GiftMessage {
  Common common = 1;
  User user = 7;
  User toUser = 8;
  GiftStruct gift = 15;
  string interactGiftInfo = 26;
  uint64 totalCount = 29;
  uint64 sendTime = 33;
  message GiftStruct {
    string describe = 2;
    uint32 diamondCount = 12;
    string name = 16;
  }
}
//点赞消息
message LikeMessage {
  //  Common common = 1;
  uint64 count = 2;
  uint64 total = 3;
  User user = 5;
  //  string scene = 10;
}
// 成员消息
message MemberMessage {
  Common common = 1;
  User user = 2;
  uint64 memberCount = 3;
}
//关注消息
message SocialMessage {
  //  Common common = 1;
  User user = 2;
  uint64 followCount = 6;
}
//直播间统计
message RoomUserSeqMessage {
  //  Common common = 1;
  int64 total = 3;
  //  string popStr = 4;
  int64 totalUser = 7;
  string totalUserStr = 8;
}
// 直播间状态消息
// status = 3 下播
message ControlMessage {
  //  Common common = 1;
  int32 status = 2;
}
message Common {
  string method = 1;
  uint64 msgId = 2;
  uint64 roomId = 3;
  uint64 createTime = 4;
  bool isShowMsg = 6;
  string describe = 7;
}



message RoomStatsMessage {
  Common common = 1;
  string displayLong = 4;
  int64  displayValue = 5;
  int64 total = 9;
}
message InRoomBannerMessage{
  Common common = 1;
  string json = 2;
}
// 直播间排行榜
message RoomRankMessage {
  Common common = 1;
  repeated RoomRank ranksList = 2;

  message RoomRank{
    User user = 1;
    string scoreStr = 2;
    bool profileHidden = 3;
  }
}

